<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Média do Aluno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cadastro de Aluno</h1>

    <form id="formAluno">
      <label for="nome">Nome do aluno:</label>
      <input type="text" id="nome" required>

      <label for="nota1">Nota 1:</label>
      <input type="number" id="nota1" step="0.1" min="0" max="10">

      <label for="nota2">Nota 2:</label>
      <input type="number" id="nota2" step="0.1" min="0" max="10">

      <label for="nota3">Nota 3:</label>
      <input type="number" id="nota3" step="0.1" min="0" max="10">

      <label for="nota4">Nota 4:</label>
      <input type="number" id="nota4" step="0.1" min="0" max="10">

      <p class="media">Média: <span id="mediaResultado">-</span></p>

      <button type="submit">Registrar resultado</button>

      <p id="mensagemErro" class="erro"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
